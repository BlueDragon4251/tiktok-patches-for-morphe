name: Temporary TikTok runtime audit

on:
  push:
    branches:
      - agent/fix-46.4.3-settings-crash
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/fix-46.4.3-settings-crash
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Remove proven stale settings runtime injection
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('patches/src/main/kotlin/app/morphe/patches/tiktok/misc/settings/SettingsPatch.kt')
          s = p.read_text()
          old = '''        OpenDebugCellVmDefaultStateFingerprint.methodOrNull?.apply {
              val returnIndex = indexOfFirstInstructionOrThrow(Opcode.RETURN_OBJECT)
              val stateRegister = getInstruction<OneRegisterInstruction>(returnIndex).registerA
              addInstructions(
                  returnIndex,
                  """
                      new-instance v0, LX/08EY;
                      const v1, 0x7f010088
                      invoke-direct {v0, v1}, LX/08EY;-><init>(I)V
                      iput-object v0, v$stateRegister, LX/0HQM;->LLILLL:LX/08EY;
                      iput-object v0, v$stateRegister, LX/0HQM;->LLILZLL:LX/08EY;
                  """,
              )
          }

'''
          if old in s:
              p.write_text(s.replace(old, '', 1))
              print('Removed stale settings icon/state injection')
          else:
              print('Settings stale block already absent')
          PY

      - name: Audit hard-coded runtime references
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          roots = [Path('patches/src/main/kotlin/app/morphe/patches/tiktok'), Path('extensions/tiktok/src/main/java')]
          obf = re.compile(r'LX/[A-Za-z0-9_$]+;')
          res = re.compile(r'0x7f[0-9a-fA-F]{6,8}')
          rows = []
          stale_versions = []
          for root in roots:
              for p in root.rglob('*'):
                  if p.suffix not in {'.kt', '.java'}:
                      continue
                  text = p.read_text(errors='replace')
                  for n, line in enumerate(text.splitlines(), 1):
                      hits = sorted(set(obf.findall(line) + res.findall(line)))
                      if hits:
                          rows.append((str(p), n, ', '.join(hits), line.strip()))
                      if '46.2.3' in line:
                          stale_versions.append((str(p), n, line.strip()))
          out = []
          out.append('=== Hard-coded TikTok/obfuscated runtime references ===')
          for p, n, hits, line in rows:
              out.append(f'{p}:{n}: {hits} :: {line}')
          out.append('')
          out.append('=== Remaining literal 46.2.3 references ===')
          for p, n, line in stale_versions:
              out.append(f'{p}:{n}: {line}')
          Path('runtime-audit.txt').write_text('\n'.join(out) + '\n')
          print('\n'.join(out))
          forbidden = {'LX/08EY;', 'LX/0HQM;', 'LX/0Lze;', '0x7f010088'}
          found = sorted({h for _,_,hits,_ in rows for h in hits.split(', ') if h in forbidden})
          if found:
              raise SystemExit('Known stale 46.2.3 runtime references remain: ' + ', '.join(found))
          PY

      - name: Build patches and metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid :patches:generatePatchesList --no-daemon

      - name: Commit audit and fixes
        if: github.event_name == 'push'
        shell: bash
        run: |
          rm -f .github/workflows/temp_fix_settings_runtime.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add patches/src/main/kotlin/app/morphe/patches/tiktok/misc/settings/SettingsPatch.kt patches-list.json runtime-audit.txt .github/workflows/temp_fix_settings_runtime.yml
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
            exit 0
          fi
          git commit -m 'fix(tiktok): remove stale runtime references'
          git push origin HEAD:agent/fix-46.4.3-settings-crash

# retrigger audit after interrupted assistant run
