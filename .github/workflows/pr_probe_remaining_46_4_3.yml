name: Probe remaining TikTok 46.4.3 hooks

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install analyzer
        run: python -m pip install --disable-pip-version-check androguard==4.1.3 loguru
      - name: Download and probe exact TikTok 46.4.3 APK
        shell: bash
        env:
          LOGURU_LEVEL: ERROR
        run: |
          python - <<'PY'
          import hashlib, html, urllib.request, sys
          from html.parser import HTMLParser
          from collections import defaultdict
          from loguru import logger
          logger.remove(); logger.add(sys.stderr, level='ERROR')
          from androguard.core.apk import APK
          from androguard.core.dex import DEX

          PAGE = 'https://www.mediafire.com/file/sd2x6vnmv1ocnv7/com.zhiliaoapp.musically_46.4.3-2024604030_minAPI23(arm64-v8a,armeabi-v7a)(nodpi)_apkmirror.com.apk/file'
          EXPECTED = '79062fb88d2eef8d6e11bbf766b4b40ee08d89cdc594ff26b549ccce7b50c4b2'
          UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'

          class Parser(HTMLParser):
              def __init__(self): super().__init__(); self.url = None
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag == 'a' and a.get('id') == 'downloadButton': self.url = a.get('href')

          req = urllib.request.Request(PAGE, headers={'User-Agent': UA})
          with urllib.request.urlopen(req, timeout=60) as r:
              page = r.read().decode('utf-8', errors='replace')
          p = Parser(); p.feed(page)
          if not p.url: raise RuntimeError('MediaFire direct URL not found')
          digest = hashlib.sha256()
          req = urllib.request.Request(html.unescape(p.url), headers={'User-Agent': UA})
          with urllib.request.urlopen(req, timeout=180) as r, open('tiktok.apk', 'wb') as out:
              while True:
                  b = r.read(1024 * 1024)
                  if not b: break
                  out.write(b); digest.update(b)
          if digest.hexdigest() != EXPECTED: raise RuntimeError('APK SHA mismatch')

          apk = APK('tiktok.apk')
          class_map = {}
          dex_no = {}
          for di, data in enumerate(apk.get_all_dex(), 1):
              dex = DEX(data)
              for cls in dex.get_classes():
                  class_map[cls.get_name()] = cls
                  dex_no[cls.get_name()] = di

          def desc(m): return m.get_descriptor().replace(' ', '')
          def dump_class(name, filter_fn=None, instructions=True):
              cls = class_map.get(name)
              print(f'\n===== CLASS {name} dex={dex_no.get(name)} exists={cls is not None} =====')
              if not cls: return
              for m in cls.get_methods():
                  if filter_fn and not filter_fn(m): continue
                  print(f'METHOD {m.get_name()}{desc(m)} flags={m.get_access_flags_string()}')
                  if not instructions or not m.get_code(): continue
                  insns = list(m.get_instructions())
                  for i, ins in enumerate(insns):
                      out = ins.get_output()
                      if (len(insns) <= 120 or ins.get_name().startswith(('invoke','iget','sget','return')) or
                          'UrlModel' in out or 'Sticker' in out or 'List;' in out or 'captcha' in out.lower() or
                          '0Lze' in out or 'Boolean;->valueOf' in out):
                          print(f'  {i:04d}: {ins.get_name():28s} {out}')

          print('===== TAKO ASSEM =====')
          for name in sorted(n for n in class_map if n.endswith('/feed/assem/tikbot/TakoAssem;')):
              dump_class(name, lambda m: desc(m) in {'(Z)V','(Landroid/view/View;)V'}, True)

          print('\n===== TAB ABILITY ASSEM =====')
          for name in sorted(n for n in class_map if n.endswith('/TabAbilityAssem;')):
              dump_class(name, lambda m: desc(m) == '()Ljava/util/List;', True)

          print('\n===== CAPTCHA CLASSES =====')
          for name in sorted(n for n in class_map if n.endswith('/sec/SecApiImpl;')):
              dump_class(name, lambda m: 'Captcha' in m.get_name() or 'captcha' in m.get_name(), True)
          dump_class('Lcom/tts/oecverify/verify/RiskControlService;', None, False)
          for name in sorted(n for n in class_map if n.endswith('/live/livehostimpl/LiveHostUser;')):
              dump_class(name, lambda m: 'Captcha' in m.get_name() or 'captcha' in m.get_name(), True)

          print('\n===== STICKER PREVIEW OLD CLASSES =====')
          for name in ('LX/0ULN;', 'LX/0UL9;', 'LX/16zb;'):
              dump_class(name, None, True)

          print('\n===== STICKER CANDIDATES BY METHOD SHAPE =====')
          for name, cls in class_map.items():
              for m in cls.get_methods():
                  d = desc(m)
                  if m.get_name() == '<init>' or not m.get_code(): continue
                  # Binder-like: void, boolean + String + Map among parameters, reads UrlModel.
                  if d.endswith(')V') and 'ZLjava/lang/String;Ljava/util/Map;' in d:
                      insns = list(m.get_instructions())
                      outs = [ins.get_output() for ins in insns]
                      if any('Lcom/ss/android/ugc/aweme/base/model/UrlModel;' in x for x in outs):
                          print(f'BINDER_CANDIDATE {name}->{m.get_name()}{d} dex={dex_no[name]}')
                          for i, ins in enumerate(insns):
                              out = ins.get_output()
                              if ins.get_name().startswith(('invoke','iget','sget','return')) or 'UrlModel' in out:
                                  print(f'  {i:04d}: {ins.get_name():28s} {out}')
                  # Source-like: has StickerItem and View and three Function0 args.
                  if ('Lcom/ss/android/ugc/aweme/im/common/model/StickerItem;' in d and
                      'Landroid/view/View;' in d and d.count('Lkotlin/jvm/functions/Function0;') >= 3):
                      print(f'SOURCE_CANDIDATE {name}->{m.get_name()}{d} dex={dex_no[name]}')
                      for i, ins in enumerate(m.get_instructions()):
                          if ins.get_name().startswith('invoke'):
                              print(f'  {i:04d}: {ins.get_name():28s} {ins.get_output()}')

          print('\n===== RESUME GATE CANDIDATES =====')
          # Old gate was a zero-arg invoke() returning Object. Find such lambdas that touch the
          # playback progress state holder or return Boolean.valueOf.
          for name, cls in class_map.items():
              for m in cls.get_methods():
                  if m.get_name() != 'invoke' or desc(m) != '()Ljava/lang/Object;' or not m.get_code():
                      continue
                  insns = list(m.get_instructions())
                  outs = [ins.get_output() for ins in insns]
                  score = sum('LX/0Lze;' in x for x in outs) + sum('Ljava/lang/Boolean;->valueOf' in x for x in outs)
                  if score:
                      print(f'RESUME_CANDIDATE {name}->invoke()Ljava/lang/Object; dex={dex_no[name]} score={score}')
                      for i, ins in enumerate(insns):
                          print(f'  {i:04d}: {ins.get_name():28s} {ins.get_output()}')

          print('\n===== 0Lze REFERENCES FROM ZERO-ARG OBJECT METHODS =====')
          for name, cls in class_map.items():
              for m in cls.get_methods():
                  if desc(m) != '()Ljava/lang/Object;' or not m.get_code(): continue
                  insns = list(m.get_instructions())
                  if any('LX/0Lze;' in ins.get_output() for ins in insns):
                      print(f'0LZE_OBJECT_METHOD {name}->{m.get_name()}{desc(m)} dex={dex_no[name]}')
                      for i, ins in enumerate(insns):
                          print(f'  {i:04d}: {ins.get_name():28s} {ins.get_output()}')
          PY
