name: Discover TikTok 46.4.3 offline config

on:
  push:
    branches:
      - agent/tiktok-46.4.3-port
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 androguard==4.1.3

      - name: Download TikTok 46.4.3
        shell: bash
        run: |
          python - <<'PY'
          import html
          import requests
          from bs4 import BeautifulSoup

          page_url = "https://www.mediafire.com/file/sd2x6vnmv1ocnv7/com.zhiliaoapp.musically_46.4.3-2024604030_minAPI23(arm64-v8a,armeabi-v7a)(nodpi)_apkmirror.com.apk/file"
          headers = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36"}
          page = requests.get(page_url, headers=headers, timeout=60)
          page.raise_for_status()
          button = BeautifulSoup(page.text, "html.parser").find(id="downloadButton")
          if button is None or not button.get("href"):
              raise RuntimeError("MediaFire direct download link was not found")
          url = html.unescape(button["href"])
          with requests.get(url, headers=headers, stream=True, timeout=(60, 180)) as response:
              response.raise_for_status()
              with open("tiktok-46.4.3.apk", "wb") as fh:
                  for chunk in response.iter_content(1024 * 1024):
                      if chunk:
                          fh.write(chunk)
          PY

      - name: Discover config candidates
        shell: bash
        env:
          LOGURU_LEVEL: ERROR
        run: |
          python - <<'PY' > offline-config-candidates.txt
          import sys
          from loguru import logger
          logger.remove()
          logger.add(sys.stderr, level="ERROR")

          from androguard.core.apk import APK
          from androguard.core.dex import DEX

          apk = APK("tiktok-46.4.3.apk")
          enum_type = "LX/0itP;"
          candidates = []
          generic_list_candidates = []

          for dex_index, dex_bytes in enumerate(apk.get_all_dex(), start=1):
              dex = DEX(dex_bytes)
              for cls in dex.get_classes():
                  clinit = next((m for m in cls.get_methods() if m.get_name() == "<clinit>"), None)
                  if clinit is None or clinit.get_code() is None:
                      continue

                  instructions = list(clinit.get_instructions())
                  rendered = [(i, ins.get_name(), ins.get_output()) for i, ins in enumerate(instructions)]
                  enum_refs = [item for item in rendered if enum_type in item[2]]
                  list_sputs = [item for item in rendered if item[1].startswith("sput-object") and "Ljava/util/List;" in item[2]]
                  list_fields = []
                  for field in cls.get_fields():
                      try:
                          if field.get_descriptor() == "Ljava/util/List;":
                              list_fields.append(field.get_name())
                      except Exception:
                          pass

                  if enum_refs:
                      candidates.append((dex_index, cls, rendered, enum_refs, list_sputs, list_fields))
                  if len(list_sputs) >= 2:
                      generic_list_candidates.append((dex_index, cls.get_name(), len(list_sputs), list_fields))

          print("=== CLINIT CLASSES REFERENCING", enum_type, "===")
          print("count:", len(candidates))
          for dex_index, cls, rendered, enum_refs, list_sputs, list_fields in candidates:
              print()
              print(f"=== CANDIDATE {cls.get_name()} (dex {dex_index}) ===")
              print("List fields:", list_fields)
              print("List sput count:", len(list_sputs))
              print("Enum references:")
              for item in enum_refs:
                  print(f"  {item[0]:04d}: {item[1]:28s} {item[2]}")
              print("Relevant <clinit> bytecode:")
              for i, name, output in rendered:
                  if (
                      enum_type in output
                      or "Ljava/util/List;" in output
                      or name.startswith("move-result-object")
                      or name.startswith("invoke-static")
                      or name.startswith("sget-object")
                  ):
                      print(f"  {i:04d}: {name:28s} {output}")

          print()
          print("=== CLASSES WITH >= 2 STATIC LIST WRITES ===")
          print("count:", len(generic_list_candidates))
          for dex_index, name, count, fields in generic_list_candidates:
              print(f"dex {dex_index:02d}  {name}  list_sputs={count}  list_fields={fields}")
          PY
          cat offline-config-candidates.txt

      - name: Post discovery to PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let text = fs.existsSync('offline-config-candidates.txt')
              ? fs.readFileSync('offline-config-candidates.txt', 'utf8')
              : 'No discovery report was produced.';
            if (text.length > 60000) text = text.slice(0, 60000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body: `### TikTok 46.4.3 offline config discovery\n\nCommit: \`${context.sha}\`\n\n\`\`\`text\n${text}\n\`\`\``
            });
