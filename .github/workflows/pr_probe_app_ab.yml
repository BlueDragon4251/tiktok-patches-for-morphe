name: Probe TikTok 46.4.3 App AB

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install analyzer
        run: python -m pip install --disable-pip-version-check androguard==4.1.3 loguru
      - name: Download and inspect exact TikTok APK
        shell: bash
        env:
          LOGURU_LEVEL: ERROR
        run: |
          python - <<'PY'
          import hashlib, html, urllib.request, sys
          from html.parser import HTMLParser
          from loguru import logger
          logger.remove(); logger.add(sys.stderr, level='ERROR')
          from androguard.core.apk import APK
          from androguard.core.dex import DEX

          PAGE = 'https://www.mediafire.com/file/sd2x6vnmv1ocnv7/com.zhiliaoapp.musically_46.4.3-2024604030_minAPI23(arm64-v8a,armeabi-v7a)(nodpi)_apkmirror.com.apk/file'
          EXPECTED = '79062fb88d2eef8d6e11bbf766b4b40ee08d89cdc594ff26b549ccce7b50c4b2'
          UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'

          class Parser(HTMLParser):
              def __init__(self): super().__init__(); self.url = None
              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  if tag == 'a' and values.get('id') == 'downloadButton': self.url = values.get('href')

          req = urllib.request.Request(PAGE, headers={'User-Agent': UA})
          with urllib.request.urlopen(req, timeout=60) as r:
              page = r.read().decode('utf-8', errors='replace')
          parser = Parser(); parser.feed(page)
          if not parser.url: raise RuntimeError('MediaFire direct URL not found')

          digest = hashlib.sha256()
          req = urllib.request.Request(html.unescape(parser.url), headers={'User-Agent': UA})
          with urllib.request.urlopen(req, timeout=180) as r, open('tiktok.apk', 'wb') as out:
              while True:
                  chunk = r.read(1024 * 1024)
                  if not chunk: break
                  out.write(chunk); digest.update(chunk)
          if digest.hexdigest() != EXPECTED: raise RuntimeError('APK SHA mismatch')

          required = {
              '(ILjava/lang/String;ZZ)Z',
              '(DILjava/lang/String;Z)D',
              '(ILjava/lang/String;ZF)F',
              '(IILjava/lang/String;Z)I',
              '(IJLjava/lang/String;Z)J',
              '(ILjava/lang/String;Ljava/lang/String;Z)Ljava/lang/String;',
              '(Ljava/lang/String;Z)Ljava/lang/Object;',
          }
          found = []
          apk = APK('tiktok.apk')
          for dex_no, data in enumerate(apk.get_all_dex(), 1):
              dex = DEX(data)
              for cls in dex.get_classes():
                  methods = list(cls.get_methods())
                  descriptors = {m.get_descriptor().replace(' ', '') for m in methods}
                  if required.issubset(descriptors):
                      found.append(cls.get_name())
                      print(f'APP_AB_CLASS={cls.get_name()} dex={dex_no}')
                      for m in methods:
                          descriptor = m.get_descriptor().replace(' ', '')
                          if descriptor in required:
                              print(f'  {m.get_name()}{descriptor}')
          print('APP_AB_MATCH_COUNT=', len(found))
          if len(found) != 1:
              raise SystemExit(f'Expected exactly one App AB class, found {found}')
          PY
