name: TikTok 46.4.3 acceptance

on:
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build patch bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid :patches:generatePatchesList --no-daemon

      - name: Resolve runtime bundle
        shell: bash
        run: |
          set -euo pipefail
          MPP="$(find patches/build/libs -maxdepth 1 -type f -name '*.mpp' ! -name '*-sources.mpp' | sort | head -n 1)"
          test -n "$MPP"
          case "$MPP" in
            *-sources.mpp) echo "Refusing source MPP: $MPP" >&2; exit 1 ;;
          esac
          echo "Using runtime bundle: $MPP"
          echo "MPP=$MPP" >> "$GITHUB_ENV"

      - name: Download exact TikTok 46.4.3 APK
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, html, urllib.request
          from html.parser import HTMLParser

          PAGE = "https://www.mediafire.com/file/sd2x6vnmv1ocnv7/com.zhiliaoapp.musically_46.4.3-2024604030_minAPI23(arm64-v8a,armeabi-v7a)(nodpi)_apkmirror.com.apk/file"
          UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36"
          EXPECTED = "79062fb88d2eef8d6e11bbf766b4b40ee08d89cdc594ff26b549ccce7b50c4b2"

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.url = None

              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  if tag == "a" and values.get("id") == "downloadButton":
                      self.url = values.get("href")

          request = urllib.request.Request(PAGE, headers={"User-Agent": UA})
          with urllib.request.urlopen(request, timeout=60) as response:
              page = response.read().decode("utf-8", errors="replace")

          parser = Parser()
          parser.feed(page)
          if not parser.url:
              raise RuntimeError("MediaFire download URL not found")

          request = urllib.request.Request(html.unescape(parser.url), headers={"User-Agent": UA})
          digest = hashlib.sha256()
          size = 0
          with urllib.request.urlopen(request, timeout=180) as response, open("tiktok-46.4.3.apk", "wb") as output:
              while True:
                  chunk = response.read(1024 * 1024)
                  if not chunk:
                      break
                  output.write(chunk)
                  digest.update(chunk)
                  size += len(chunk)

          actual = digest.hexdigest()
          print("Downloaded bytes:", size)
          print("SHA-256:", actual)
          if actual != EXPECTED:
              raise RuntimeError(f"SHA mismatch: {actual}")
          PY

      - name: Download Morphe Desktop CLI
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_JSON="$(curl -fsSL -H 'Accept: application/vnd.github+json' https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest)"
          URL="$(printf '%s' "$RELEASE_JSON" | jq -r '.assets[] | select(.name | endswith("-all.jar")) | .browser_download_url' | head -n 1)"
          test -n "$URL" && test "$URL" != null
          curl -fL --retry 3 "$URL" -o morphe-desktop.jar

      - name: Apply all default patches
        id: patch
        shell: bash
        env:
          JAVA_TOOL_OPTIONS: -Xmx6g
        run: |
          set +e
          java -jar morphe-desktop.jar patch \
            -p "$MPP" \
            --continue-on-error \
            --unsigned \
            --result-file morphe-result.json \
            -o /tmp/tiktok-patched.apk \
            tiktok-46.4.3.apk 2>&1 | tee morphe.log
          code=${PIPESTATUS[0]}

          if grep -q 'INFO: Applying 0 patches' morphe.log; then
            echo 'Morphe selected zero patches; treating this as an acceptance failure.' >&2
            code=97
          fi

          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate result JSON
        id: result
        if: always()
        shell: bash
        run: |
          set +e
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path("morphe-result.json")
          if not path.exists():
              print("morphe-result.json was not produced", file=sys.stderr)
              raise SystemExit(1)

          data = json.loads(path.read_text())
          applied = data.get("appliedPatches") or []
          failed = data.get("failedPatches") or []
          print(f"Applied patches: {len(applied)}")
          print(f"Failed patches: {len(failed)}")
          for item in failed:
              print("FAILED:", item)

          if not applied:
              print("Acceptance is invalid because no patches were applied.", file=sys.stderr)
              raise SystemExit(2)
          if failed:
              raise SystemExit(3)
          PY
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Summarize failures
        if: always()
        shell: bash
        run: |
          echo '=== FAILED PATCHES ==='
          grep -E 'SEVERE: FAILED:|Patching aborted|PatchException|Failed to match|Could not find instruction' morphe.log || true
          echo '=== APPLIED COUNT ==='
          grep -c '^INFO: Applied:' morphe.log || true
          echo '=== RESULT JSON ==='
          cat morphe-result.json 2>/dev/null || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-46.4.3-acceptance
          path: |
            morphe.log
            morphe-result.json
          if-no-files-found: warn
          retention-days: 1

      - name: Fail if acceptance reported failures
        if: steps.patch.outputs.exit_code != '0' || steps.result.outputs.exit_code != '0'
        run: |
          echo "Morphe exit code: ${{ steps.patch.outputs.exit_code }}"
          echo "Result validation exit code: ${{ steps.result.outputs.exit_code }}"
          exit 1
