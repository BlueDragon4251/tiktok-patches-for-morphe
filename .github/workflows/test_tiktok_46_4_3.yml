name: Test TikTok 46.4.3 patches

on:
  push:
    branches:
      - agent/tiktok-46.4.3-port
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3

      - name: Build patch bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid :patches:generatePatchesList --no-daemon

      - name: Locate patch bundle
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="$(find patches/build/libs -maxdepth 1 -type f -name '*.mpp' | sort | tail -n 1)"
          test -n "$BUNDLE"
          echo "PATCH_BUNDLE=$BUNDLE" >> "$GITHUB_ENV"
          echo "Using bundle: $BUNDLE"

      - name: Download TikTok 46.4.3
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import html
          import urllib.request
          from html.parser import HTMLParser

          PAGE = "https://www.mediafire.com/file/sd2x6vnmv1ocnv7/com.zhiliaoapp.musically_46.4.3-2024604030_minAPI23(arm64-v8a,armeabi-v7a)(nodpi)_apkmirror.com.apk/file"
          UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36"
          EXPECTED_SHA256 = "79062fb88d2eef8d6e11bbf766b4b40ee08d89cdc594ff26b549ccce7b50c4b2"

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.url = None
              def handle_starttag(self, tag, attrs):
                  if tag != "a":
                      return
                  values = dict(attrs)
                  if values.get("id") == "downloadButton":
                      self.url = values.get("href")

          request = urllib.request.Request(PAGE, headers={"User-Agent": UA})
          with urllib.request.urlopen(request, timeout=60) as response:
              page = response.read().decode("utf-8", errors="replace")
          parser = Parser()
          parser.feed(page)
          if not parser.url:
              raise RuntimeError("MediaFire download URL not found")

          url = html.unescape(parser.url)
          request = urllib.request.Request(url, headers={"User-Agent": UA})
          digest = hashlib.sha256()
          size = 0
          with urllib.request.urlopen(request, timeout=180) as response, open("tiktok-46.4.3.apk", "wb") as output:
              while True:
                  chunk = response.read(1024 * 1024)
                  if not chunk:
                      break
                  output.write(chunk)
                  digest.update(chunk)
                  size += len(chunk)

          actual = digest.hexdigest()
          print(f"Downloaded bytes: {size}")
          print(f"SHA-256: {actual}")
          if actual != EXPECTED_SHA256:
              raise RuntimeError(f"Unexpected APK SHA-256: {actual}")
          PY

      - name: Inspect current compatibility targets
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check androguard==4.1.3 loguru >/dev/null
          LOGURU_LEVEL=ERROR python3 - <<'PY' > compatibility-targets.txt
          import sys
          from loguru import logger
          logger.remove()
          logger.add(sys.stderr, level="ERROR")
          from androguard.core.apk import APK
          from androguard.core.dex import DEX

          targets = {"LX/0BJV;", "LX/0BIZ;"}
          found = set()
          apk = APK("tiktok-46.4.3.apk")
          for dex_index, dex_bytes in enumerate(apk.get_all_dex(), start=1):
              dex = DEX(dex_bytes)
              for cls in dex.get_classes():
                  name = cls.get_name()
                  if name not in targets:
                      continue
                  found.add(name)
                  print(f"=== {name} dex={dex_index} ===")
                  for method in cls.get_methods():
                      print(f"METHOD {method.get_name()}{method.get_descriptor()} flags={method.get_access_flags_string()}")
                      code = method.get_code()
                      if code is None:
                          continue
                      for index, ins in enumerate(method.get_instructions()):
                          print(f"  {index:04d}: {ins.get_name():28s} {ins.get_output()}")
                  print()
          print("missing targets:", sorted(targets - found))
          PY
          cat compatibility-targets.txt

      - name: Download Morphe Desktop CLI
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_JSON="$(curl -fsSL -H 'Accept: application/vnd.github+json' https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest)"
          MORPHE_URL="$(printf '%s' "$RELEASE_JSON" | jq -r '.assets[] | select(.name | endswith("-all.jar")) | .browser_download_url' | head -n 1)"
          test -n "$MORPHE_URL"
          test "$MORPHE_URL" != "null"
          echo "Downloading: $MORPHE_URL"
          curl -fL --retry 3 --retry-delay 2 "$MORPHE_URL" -o morphe-desktop-all.jar
          java -version
          java -jar morphe-desktop-all.jar --help | head -n 40

      - name: Patch TikTok 46.4.3
        id: patch
        shell: bash
        continue-on-error: true
        run: |
          set +e
          set -o pipefail
          java -jar morphe-desktop-all.jar patch \
            -p "$PATCH_BUNDLE" \
            --continue-on-error \
            --unsigned \
            --result-file morphe-46.4.3-result.json \
            -o tiktok-46.4.3-patched.apk \
            tiktok-46.4.3.apk 2>&1 | tee morphe-46.4.3.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Post patch result to PR
        if: always()
        uses: actions/github-script@v7
        env:
          PATCH_EXIT_CODE: ${{ steps.patch.outputs.exit_code }}
        with:
          script: |
            const fs = require('fs');
            const parts = [];
            for (const path of ['compatibility-targets.txt', 'morphe-46.4.3.log']) {
              if (fs.existsSync(path)) parts.push(`===== ${path} =====\n${fs.readFileSync(path, 'utf8')}`);
            }
            let text = parts.length ? parts.join('\n\n') : 'No compatibility or Morphe log was produced.';
            if (text.length > 48000) text = text.slice(-48000);
            const exitCode = process.env.PATCH_EXIT_CODE || 'not-run';
            const result = fs.existsSync('morphe-46.4.3-result.json')
              ? fs.readFileSync('morphe-46.4.3-result.json', 'utf8')
              : 'No JSON result file.';
            const body = [
              '### TikTok 46.4.3 full patch test',
              '',
              `Commit: \`${context.sha}\``,
              `Morphe exit code: \`${exitCode}\``,
              '',
              '```text',
              text,
              '```',
              '',
              '<details><summary>JSON result</summary>',
              '',
              '```json',
              result.length > 9000 ? result.slice(-9000) : result,
              '```',
              '</details>',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body,
            });

      - name: Fail when patching failed
        if: steps.patch.outputs.exit_code != '0'
        run: exit 1
