name: TikTok acceptance matrix
on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
concurrency:
  group: tiktok-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  acceptance:
    uses: ./.github/workflows/tiktok_fixture_matrix.yml
    with:
      kind: acceptance
    secrets: inherit
