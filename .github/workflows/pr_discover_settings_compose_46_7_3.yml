name: TikTok 46.7.3 settings compose discovery

on:
  pull_request:
    branches:
      - dev
      - main

concurrency:
  group: tiktok-46-7-3-settings-discovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  discover-settings:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download exact TikTok 46.7.3 APK
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="b9e96e64e94ac0f9ea229dd0ba743f1930121a8b6941cf9fd87191604da0129e"
          curl -fL --retry 4 --retry-delay 3 \
            -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36' \
            'https://d.apkpure.net/b/APK/com.zhiliaoapp.musically?version=latest' \
            -o tiktok-46.7.3.apk
          ACTUAL="$(sha256sum tiktok-46.7.3.apk | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"
          mkdir -p /tmp/dex
          unzip -q -j tiktok-46.7.3.apk 'classes*.dex' -d /tmp/dex

      - name: Dump complete SettingsComposeRvmpFragment
        shell: bash
        run: |
          set -euo pipefail
          DEXDUMP="$(find "$ANDROID_HOME/build-tools" -type f -name dexdump 2>/dev/null | sort -V | tail -n 1)"
          test -x "$DEXDUMP"
          TARGET='Lcom/ss/android/ugc/aweme/setting/ui/rvmpcompose/SettingsComposeRvmpFragment;'
          : > settings-compose-class.txt

          found=0
          for dex in /tmp/dex/*.dex; do
            if ! strings "$dex" | grep -Fq "$TARGET"; then
              continue
            fi

            dump=/tmp/settings-dexdump.txt
            timeout 120s "$DEXDUMP" -d "$dex" > "$dump" 2>&1
            awk -v target="$TARGET" '
              $0 ~ "Class descriptor  : ." target "." {capture=1}
              capture {print}
              capture && /source_file_idx/ {exit}
            ' "$dump" > settings-compose-class.txt

            if grep -Fq "$TARGET" settings-compose-class.txt; then
              echo "DEX=$(basename "$dex")" > settings-compose-meta.txt
              found=1
              break
            fi
          done

          test "$found" = 1
          test -s settings-compose-class.txt

      - name: Upload exact settings evidence
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-46.7.3-settings-compose-discovery
          path: |
            settings-compose-class.txt
            settings-compose-meta.txt
          if-no-files-found: error
          retention-days: 1
