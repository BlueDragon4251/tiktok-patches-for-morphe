name: Analyze TikTok 46.4.3 bytecode

on:
  push:
    branches:
      - agent/tiktok-46.4.3-port
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 androguard==4.1.3

      - name: Download TikTok 46.4.3
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import html
          import requests
          from bs4 import BeautifulSoup

          page_url = "https://www.mediafire.com/file/sd2x6vnmv1ocnv7/com.zhiliaoapp.musically_46.4.3-2024604030_minAPI23(arm64-v8a,armeabi-v7a)(nodpi)_apkmirror.com.apk/file"
          headers = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36"}
          page = requests.get(page_url, headers=headers, timeout=60)
          page.raise_for_status()
          soup = BeautifulSoup(page.text, "html.parser")
          button = soup.find(id="downloadButton")
          if button is None or not button.get("href"):
              raise RuntimeError("MediaFire direct download link was not found")
          direct = html.unescape(button["href"])

          digest = hashlib.sha256()
          size = 0
          with requests.get(direct, headers=headers, stream=True, timeout=(60, 180)) as response:
              response.raise_for_status()
              with open("tiktok-46.4.3.apk", "wb") as fh:
                  for chunk in response.iter_content(1024 * 1024):
                      if chunk:
                          fh.write(chunk)
                          digest.update(chunk)
                          size += len(chunk)
          print("bytes:", size)
          print("sha256:", digest.hexdigest())
          if digest.hexdigest() != "79062fb88d2eef8d6e11bbf766b4b40ee08d89cdc594ff26b549ccce7b50c4b2":
              raise RuntimeError("Unexpected APK SHA-256")
          PY

      - name: Scan 46.4.3 descriptors and offline hooks
        shell: bash
        env:
          LOGURU_LEVEL: ERROR
        run: |
          python - <<'PY' 2>&1 | tee tiktok-46.4.3-port-report.txt
          import glob
          import re
          import sys
          from collections import defaultdict
          from loguru import logger
          logger.remove()
          logger.add(sys.stderr, level="ERROR")
          from androguard.core.apk import APK
          from androguard.core.dex import DEX

          apk = APK("tiktok-46.4.3.apk")
          print("=== APK ===")
          print(apk.get_package(), apk.get_androidversion_name(), apk.get_androidversion_code())

          dexes = []
          class_map = {}
          class_dex = {}
          for dex_index, dex_bytes in enumerate(apk.get_all_dex(), start=1):
              dex = DEX(dex_bytes)
              dexes.append(dex)
              for cls in dex.get_classes():
                  class_map[cls.get_name()] = cls
                  class_dex[cls.get_name()] = dex_index

          print("\n=== HARDCODED LX DESCRIPTORS USED BY TIKTOK PATCHES ===")
          source_descriptors = defaultdict(set)
          for path in glob.glob("patches/src/main/kotlin/app/morphe/patches/tiktok/**/*.kt", recursive=True):
              text = open(path, encoding="utf-8").read()
              for desc in re.findall(r"LX/[A-Za-z0-9_$]+;", text):
                  source_descriptors[desc].add(path)
          missing = []
          for desc in sorted(source_descriptors):
              exists = desc in class_map
              print(("OK      " if exists else "MISSING ") + desc + " <- " + ", ".join(sorted(source_descriptors[desc])))
              if not exists:
                  missing.append(desc)
          print(f"descriptor total={len(source_descriptors)} missing={len(missing)}")

          enum_desc = None
          for name, cls in class_map.items():
              names = {f.get_name() for f in cls.get_fields()}
              if "DOWNLOAD_200_VIDEOS" in names:
                  enum_desc = name
                  break
          print("\n=== OFFLINE ENUM ===")
          print("enum descriptor:", enum_desc)
          if enum_desc:
              cls = class_map[enum_desc]
              print("dex:", class_dex[enum_desc])
              print("fields:", [(f.get_name(), f.get_descriptor()) for f in cls.get_fields()])
              for method in cls.get_methods():
                  if method.get_name() == "<clinit>" and method.get_code():
                      for i, ins in enumerate(method.get_instructions()):
                          out = ins.get_output()
                          if "DOWNLOAD_200_VIDEOS" in out or ins.get_name().startswith("invoke-direct"):
                              print(f"  {i:04d}: {ins.get_name():24s} {out}")

          print("\n=== REFERENCES TO OFFLINE ENUM DOWNLOAD_* FIELDS ===")
          candidates = defaultdict(list)
          if enum_desc:
              needle = enum_desc + "->DOWNLOAD_"
              for cls_name, cls in class_map.items():
                  for method in cls.get_methods():
                      code = method.get_code()
                      if code is None:
                          continue
                      instructions = list(method.get_instructions())
                      for i, ins in enumerate(instructions):
                          out = ins.get_output()
                          if needle in out:
                              candidates[(cls_name, method.get_name(), method.get_descriptor())].append(i)
              for (cls_name, method_name, method_desc), indexes in candidates.items():
                  print(f"CANDIDATE {cls_name} dex={class_dex[cls_name]} {method_name}{method_desc} refs={indexes}")
                  method = next(m for m in class_map[cls_name].get_methods() if m.get_name() == method_name and m.get_descriptor() == method_desc)
                  instructions = list(method.get_instructions())
                  keep = set()
                  for idx in indexes:
                      keep.update(range(max(0, idx - 8), min(len(instructions), idx + 12)))
                  for i in sorted(keep):
                      ins = instructions[i]
                      print(f"  {i:04d}: {ins.get_name():28s} {ins.get_output()}")
                  print("  fields:", [(f.get_name(), f.get_descriptor()) for f in class_map[cls_name].get_fields()])

          print("\n=== STATIC LIST CONFIG CANDIDATES ===")
          for cls_name, cls in class_map.items():
              list_fields = [f for f in cls.get_fields() if f.get_descriptor() == "Ljava/util/List;"]
              if len(list_fields) < 2:
                  continue
              clinit = next((m for m in cls.get_methods() if m.get_name() == "<clinit>"), None)
              if clinit is None or clinit.get_code() is None:
                  continue
              instructions = list(clinit.get_instructions())
              enum_refs = [i for i, ins in enumerate(instructions) if enum_desc and enum_desc in ins.get_output()]
              list_writes = [i for i, ins in enumerate(instructions) if ins.get_name().startswith("sput-object") and "Ljava/util/List;" in ins.get_output()]
              if not enum_refs and len(list_writes) < 2:
                  continue
              print(f"LIST-CANDIDATE {cls_name} dex={class_dex[cls_name]} list_fields={[(f.get_name(), f.get_descriptor()) for f in list_fields]} enum_refs={enum_refs} list_writes={list_writes}")
              interesting = set()
              for idx in enum_refs + list_writes:
                  interesting.update(range(max(0, idx - 10), min(len(instructions), idx + 10)))
              for i in sorted(interesting):
                  ins = instructions[i]
                  print(f"  {i:04d}: {ins.get_name():28s} {ins.get_output()}")

          print("\n=== STABLE OFFLINE CLASSES ===")
          for suffix in ("/OfflineModeSheetPageAssem;", "/OfflineModeListVM;"):
              for name in sorted(n for n in class_map if n.endswith(suffix)):
                  print(name, "dex", class_dex[name])

          print("\n=== SUMMARY ===")
          print("missing descriptors:", missing)
          print("offline enum:", enum_desc)
          print("enum reference candidate count:", len(candidates))
          PY

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-46.4.3-port-report
          path: tiktok-46.4.3-port-report.txt
          retention-days: 1
