name: Analyze TikTok 46.4.3 bytecode

on:
  push:
    branches:
      - agent/tiktok-46.4.3-port
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 androguard==4.1.3

      - name: Download TikTok 46.4.3 from provided MediaFire link
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee tiktok-46.4.3-download-report.txt
          import hashlib
          import html
          import requests
          from bs4 import BeautifulSoup

          page_url = "https://www.mediafire.com/file/sd2x6vnmv1ocnv7/com.zhiliaoapp.musically_46.4.3-2024604030_minAPI23(arm64-v8a,armeabi-v7a)(nodpi)_apkmirror.com.apk/file"
          headers = {
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36"
          }
          page = requests.get(page_url, headers=headers, timeout=60)
          page.raise_for_status()
          soup = BeautifulSoup(page.text, "html.parser")
          button = soup.find(id="downloadButton")
          if button is None or not button.get("href"):
              raise RuntimeError("MediaFire direct download link was not found")
          download_url = html.unescape(button["href"])
          if not download_url.startswith("https://"):
              raise RuntimeError(f"Unexpected MediaFire download URL: {download_url!r}")

          output = "tiktok-46.4.3.apk"
          digest = hashlib.sha256()
          size = 0
          with requests.get(download_url, headers=headers, stream=True, timeout=(60, 180)) as response:
              response.raise_for_status()
              with open(output, "wb") as fh:
                  for chunk in response.iter_content(chunk_size=1024 * 1024):
                      if not chunk:
                          continue
                      fh.write(chunk)
                      digest.update(chunk)
                      size += len(chunk)
          print(f"Downloaded bytes: {size}")
          print(f"SHA-256: {digest.hexdigest()}")
          expected = "79062fb88d2eef8d6e11bbf766b4b40ee08d89cdc594ff26b549ccce7b50c4b2"
          actual = digest.hexdigest()
          if actual != expected:
              raise RuntimeError(f"SHA-256 mismatch: expected {expected}, got {actual}")
          PY

      - name: Inspect APK and relevant DEX classes
        shell: bash
        env:
          LOGURU_LEVEL: ERROR
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee tiktok-46.4.3-bytecode-report.txt
          import sys
          from loguru import logger
          logger.remove()
          logger.add(sys.stderr, level="ERROR")

          from androguard.core.apk import APK
          from androguard.core.dex import DEX

          path = "tiktok-46.4.3.apk"
          apk = APK(path)
          print("=== APK METADATA ===")
          print("package:", apk.get_package())
          print("versionName:", apk.get_androidversion_name())
          print("versionCode:", apk.get_androidversion_code())
          print()

          wanted_exact = {"LX/0sIr;", "LX/0mE9;", "LX/0itP;"}
          wanted_suffixes = (
              "/OfflineModeSheetPageAssem;",
              "/OfflineModeListVM;",
          )
          hits = []
          enum_hits = []

          for dex_index, dex_bytes in enumerate(apk.get_all_dex(), start=1):
              dex = DEX(dex_bytes)
              for cls in dex.get_classes():
                  name = cls.get_name()
                  fields = list(cls.get_fields())
                  field_names = {field.get_name() for field in fields}
                  interesting = name in wanted_exact or name.endswith(wanted_suffixes)
                  if "DOWNLOAD_200_VIDEOS" in field_names:
                      interesting = True
                      enum_hits.append(name)
                  if not interesting:
                      continue

                  hits.append(name)
                  print(f"=== CLASS {name} (dex {dex_index}) ===")
                  try:
                      print("super:", cls.get_superclassname())
                  except Exception:
                      pass
                  try:
                      print("interfaces:", list(cls.get_interfaces()))
                  except Exception:
                      pass

                  print("fields:")
                  for field in fields:
                      try:
                          descriptor = field.get_descriptor()
                      except Exception:
                          descriptor = "?"
                      print(f"  {field.get_name()} : {descriptor}")

                  print("methods:")
                  for method in cls.get_methods():
                      print(f"  {method.get_name()}{method.get_descriptor()}")

                  for method in cls.get_methods():
                      if method.get_name() not in {"<clinit>", "<init>"}:
                          continue
                      print(f"-- BYTECODE {method.get_name()}{method.get_descriptor()} --")
                      code = method.get_code()
                      if code is None:
                          print("  <no code>")
                          continue
                      for index, instruction in enumerate(method.get_instructions()):
                          opname = instruction.get_name()
                          output = instruction.get_output()
                          if (
                              opname.startswith("sput")
                              or opname.startswith("invoke")
                              or opname.startswith("move-result")
                              or opname.startswith("const")
                              or "DOWNLOAD_200_VIDEOS" in output
                              or "java/util/List" in output
                          ):
                              print(f"  {index:04d}: {opname:28s} {output}")
                  print()

          print("=== SUMMARY ===")
          print("interesting classes:", hits)
          print("classes declaring DOWNLOAD_200_VIDEOS:", enum_hits)
          if apk.get_package() != "com.zhiliaoapp.musically":
              raise SystemExit("Unexpected package name")
          if apk.get_androidversion_name() != "46.4.3":
              raise SystemExit(f"Unexpected versionName: {apk.get_androidversion_name()}")
          PY

      - name: Trace references to the offline-video enum
        shell: bash
        env:
          LOGURU_LEVEL: ERROR
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee tiktok-46.4.3-offline-xrefs.txt
          import sys
          from loguru import logger
          logger.remove()
          logger.add(sys.stderr, level="ERROR")

          from androguard.core.apk import APK
          from androguard.core.dex import DEX

          apk = APK("tiktok-46.4.3.apk")
          target = "LX/0itP;"
          hits = 0

          for dex_index, dex_bytes in enumerate(apk.get_all_dex(), start=1):
              dex = DEX(dex_bytes)
              for cls in dex.get_classes():
                  class_name = cls.get_name()
                  for method in cls.get_methods():
                      code = method.get_code()
                      if code is None:
                          continue
                      insns = list(method.get_instructions())
                      matching = [i for i, insn in enumerate(insns) if target in insn.get_output()]
                      if not matching:
                          continue

                      hits += 1
                      print(f"=== XREF {class_name}->{method.get_name()}{method.get_descriptor()} (dex {dex_index}) ===")
                      fields = list(cls.get_fields())
                      if fields:
                          print("fields:")
                          for field in fields:
                              print(f"  {field.get_name()} : {field.get_descriptor()}")
                      emitted = set()
                      for match in matching:
                          start = max(0, match - 6)
                          end = min(len(insns), match + 7)
                          for idx in range(start, end):
                              if idx in emitted:
                                  continue
                              emitted.add(idx)
                              insn = insns[idx]
                              marker = ">>" if idx == match else "  "
                              print(f"{marker} {idx:04d}: {insn.get_name():28s} {insn.get_output()}")
                      print()

          print("=== XREF SUMMARY ===")
          print("methods referencing", target, ":", hits)
          PY

      - name: Build local patch bundle for 46.4.3 diagnostics
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Temporarily expose the current patch set to 46.4.3 so Morphe Desktop
          # can exercise every default TikTok patch. Actual source compatibility
          # changes are committed separately after validation.
          python - <<'PY'
          from pathlib import Path
          path = Path("patches/src/main/kotlin/app/morphe/patches/shared/compat/AppCompatibilities.kt")
          text = path.read_text()
          needle = 'targets = listOf(AppTarget("46.2.3"))'
          replacement = 'targets = listOf(AppTarget("46.2.3"), AppTarget("46.4.3"))'
          if needle not in text:
              raise SystemExit("TikTok compatibility target was not found")
          path.write_text(text.replace(needle, replacement, 1))
          PY
          ./gradlew :patches:buildAndroid :patches:generatePatchesList --no-daemon
          MPP="$(find patches/build -type f -name '*.mpp' | head -n 1)"
          if [ -z "$MPP" ]; then
            echo "No MPP produced" >&2
            exit 1
          fi
          echo "MPP=$MPP" >> "$GITHUB_ENV"
          echo "Built bundle: $MPP"

      - name: Download latest Morphe Desktop CLI
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          API="https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest"
          ASSET_URL="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$API" | jq -r '.assets[] | select(.name | endswith("-all.jar")) | .browser_download_url' | head -n 1)"
          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo "Could not resolve Morphe Desktop all.jar release asset" >&2
            exit 1
          fi
          curl -fL --retry 3 "$ASSET_URL" -o morphe-desktop.jar
          java -jar morphe-desktop.jar --version || true

      - name: Patch TikTok 46.4.3 with all default patches
        shell: bash
        env:
          JAVA_TOOL_OPTIONS: -Xmx6g
        run: |
          set +e
          java -jar morphe-desktop.jar patch \
            -p "$MPP" \
            --continue-on-error \
            --unsigned \
            --result-file tiktok-46.4.3-patch-result.json \
            --out /tmp/tiktok-46.4.3-patched.apk \
            tiktok-46.4.3.apk \
            > tiktok-46.4.3-patch-log.txt 2>&1
          STATUS=$?
          echo "Morphe CLI exit code: $STATUS" | tee -a tiktok-46.4.3-patch-log.txt
          if [ -f tiktok-46.4.3-patch-result.json ]; then
            python - <<'PY' | tee tiktok-46.4.3-patch-summary.txt
          import json
          from pathlib import Path
          data = json.loads(Path("tiktok-46.4.3-patch-result.json").read_text())
          print(json.dumps(data, indent=2)[:200000])
          PY
          else
            echo "No result JSON produced" | tee tiktok-46.4.3-patch-summary.txt
            tail -n 400 tiktok-46.4.3-patch-log.txt >> tiktok-46.4.3-patch-summary.txt
          fi
          exit 0

      - name: Upload text report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-46.4.3-bytecode-report
          path: |
            tiktok-46.4.3-download-report.txt
            tiktok-46.4.3-bytecode-report.txt
            tiktok-46.4.3-offline-xrefs.txt
            tiktok-46.4.3-patch-log.txt
            tiktok-46.4.3-patch-result.json
            tiktok-46.4.3-patch-summary.txt
          if-no-files-found: warn
          retention-days: 1

      - name: Post analysis report to draft PR
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const paths = [
              'tiktok-46.4.3-download-report.txt',
              'tiktok-46.4.3-bytecode-report.txt',
              'tiktok-46.4.3-offline-xrefs.txt',
              'tiktok-46.4.3-patch-summary.txt',
            ];
            let text = '';
            for (const path of paths) {
              if (fs.existsSync(path)) {
                text += `\n===== ${path} =====\n` + fs.readFileSync(path, 'utf8');
              }
            }
            if (!text) text = 'The analysis workflow did not produce a report file.';
            if (text.length > 55000) text = text.slice(-55000);
            const body = [
              '### TikTok 46.4.3 bytecode + patch analysis',
              '',
              `Commit: \`${context.sha}\``,
              '',
              '```text',
              text,
              '```',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body,
            });
