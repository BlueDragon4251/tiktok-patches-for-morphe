name: Analyze TikTok 46.4.3 bytecode

on:
  push:
    branches:
      - agent/tiktok-46.4.3-port
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build current patch bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew :patches:buildAndroid :patches:generatePatchesList --no-daemon
          MPP="$(find patches/build -type f -name '*.mpp' | head -n 1)"
          test -n "$MPP"
          echo "MPP=$MPP" >> "$GITHUB_ENV"

      - name: Download exact TikTok 46.4.3 APK
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, html, urllib.request
          from html.parser import HTMLParser
          PAGE = "https://www.mediafire.com/file/sd2x6vnmv1ocnv7/com.zhiliaoapp.musically_46.4.3-2024604030_minAPI23(arm64-v8a,armeabi-v7a)(nodpi)_apkmirror.com.apk/file"
          UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36"
          EXPECTED = "79062fb88d2eef8d6e11bbf766b4b40ee08d89cdc594ff26b549ccce7b50c4b2"
          class Parser(HTMLParser):
              def __init__(self): super().__init__(); self.url = None
              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  if tag == "a" and values.get("id") == "downloadButton": self.url = values.get("href")
          request = urllib.request.Request(PAGE, headers={"User-Agent": UA})
          with urllib.request.urlopen(request, timeout=60) as response:
              page = response.read().decode("utf-8", errors="replace")
          parser = Parser(); parser.feed(page)
          if not parser.url: raise RuntimeError("MediaFire download URL not found")
          request = urllib.request.Request(html.unescape(parser.url), headers={"User-Agent": UA})
          digest = hashlib.sha256(); size = 0
          with urllib.request.urlopen(request, timeout=180) as response, open("tiktok-46.4.3.apk", "wb") as output:
              while True:
                  chunk = response.read(1024 * 1024)
                  if not chunk: break
                  output.write(chunk); digest.update(chunk); size += len(chunk)
          actual = digest.hexdigest()
          print(f"Downloaded bytes: {size}")
          print(f"SHA-256: {actual}")
          if actual != EXPECTED: raise RuntimeError(f"SHA mismatch: {actual}")
          PY

      - name: Trace quick-action call sites
        shell: bash
        env:
          LOGURU_LEVEL: ERROR
        run: |
          python -m pip install --disable-pip-version-check androguard==4.1.3 loguru >/dev/null
          python - <<'PY' > quickactions-xrefs.txt
          import sys
          from loguru import logger
          logger.remove(); logger.add(sys.stderr, level="ERROR")
          from androguard.core.apk import APK
          from androguard.core.dex import DEX

          targets = (
              "LX/0BIZ;->LIZ()Z",
              "LX/0BJV;->LIZ()Z",
              "LX/0BJV;->LIZIZ Z",
          )
          apk = APK("tiktok-46.4.3.apk")
          total = 0
          for dex_index, dex_bytes in enumerate(apk.get_all_dex(), start=1):
              dex = DEX(dex_bytes)
              for cls in dex.get_classes():
                  for method in cls.get_methods():
                      code = method.get_code()
                      if code is None: continue
                      insns = list(method.get_instructions())
                      matches = [i for i, insn in enumerate(insns) if any(t in insn.get_output() for t in targets)]
                      if not matches: continue
                      total += 1
                      print(f"=== {cls.get_name()}->{method.get_name()}{method.get_descriptor()} dex={dex_index} ===")
                      emitted = set()
                      for match in matches:
                          for idx in range(max(0, match - 10), min(len(insns), match + 11)):
                              if idx in emitted: continue
                              emitted.add(idx)
                              insn = insns[idx]
                              marker = ">>" if idx == match else "  "
                              print(f"{marker} {idx:04d}: {insn.get_name():30s} {insn.get_output()}")
                      print()
          print("TOTAL METHODS:", total)
          PY
          cat quickactions-xrefs.txt

      - name: Download Morphe Desktop CLI
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_JSON="$(curl -fsSL -H 'Accept: application/vnd.github+json' https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest)"
          URL="$(printf '%s' "$RELEASE_JSON" | jq -r '.assets[] | select(.name | endswith("-all.jar")) | .browser_download_url' | head -n 1)"
          test -n "$URL" && test "$URL" != null
          curl -fL --retry 3 "$URL" -o morphe-desktop.jar

      - name: Apply all default patches
        id: patch
        shell: bash
        env:
          JAVA_TOOL_OPTIONS: -Xmx6g
        run: |
          set +e
          java -jar morphe-desktop.jar patch \
            -p "$MPP" \
            --continue-on-error \
            --unsigned \
            --result-file morphe-result.json \
            -o /tmp/tiktok-patched.apk \
            tiktok-46.4.3.apk 2>&1 | tee morphe.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build concise result
        if: always()
        shell: bash
        run: |
          {
            echo '=== QUICK ACTION XREFS ==='
            cat quickactions-xrefs.txt 2>/dev/null || true
            echo
            echo '=== FAILED PATCHES ==='
            grep -E 'SEVERE: FAILED:|PatchException|Failed to match|Could not find instruction' morphe.log || true
            echo
            echo '=== APPLIED PATCHES ==='
            grep '^INFO: Applied:' morphe.log || true
            echo
            echo '=== RESULT JSON ==='
            cat morphe-result.json 2>/dev/null || true
          } > acceptance-summary.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-46.4.3-acceptance
          path: |
            acceptance-summary.txt
            morphe.log
            morphe-result.json
            quickactions-xrefs.txt
          if-no-files-found: warn
          retention-days: 1

      - name: Post concise result to PR
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        env:
          EXIT_CODE: ${{ steps.patch.outputs.exit_code }}
        with:
          script: |
            const fs = require('fs');
            let text = fs.existsSync('acceptance-summary.txt') ? fs.readFileSync('acceptance-summary.txt', 'utf8') : 'No summary produced.';
            if (text.length > 58000) text = text.slice(-58000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body: `### TikTok 46.4.3 acceptance + quick-action xrefs\n\nCommit: \`${context.sha}\`\nMorphe exit code: \`${process.env.EXIT_CODE || 'not-run'}\`\n\n\`\`\`text\n${text}\n\`\`\``
            });

      - name: Fail if Morphe reported failures
        if: steps.patch.outputs.exit_code != '0'
        run: exit 1
