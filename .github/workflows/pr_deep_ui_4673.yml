name: TikTok 46.7.3 targeted UI discovery

on:
  pull_request:
    branches:
      - dev
      - main

concurrency:
  group: tiktok-46-7-3-targeted-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  discover-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Download exact TikTok 46.7.3 APK
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="b9e96e64e94ac0f9ea229dd0ba743f1930121a8b6941cf9fd87191604da0129e"
          curl -fL --retry 4 --retry-delay 3 \
            -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36' \
            'https://d.apkpure.net/b/APK/com.zhiliaoapp.musically?version=latest' \
            -o tiktok-46.7.3.apk
          test "$(sha256sum tiktok-46.7.3.apk | awk '{print $1}')" = "$EXPECTED"
          mkdir -p /tmp/dex /tmp/dumps
          unzip -q -j tiktok-46.7.3.apk 'classes*.dex' -d /tmp/dex

      - name: Dump exact settings renderer sidebar root and Compose palette
        shell: bash
        run: |
          set -euo pipefail
          DEXDUMP="$(find "$ANDROID_HOME/build-tools" -type f -name dexdump 2>/dev/null | sort -V | tail -n 1)"
          test -x "$DEXDUMP"
          : > targeted-ui-evidence.txt

          for dex in /tmp/dex/*.dex; do
            strings_file="/tmp/$(basename "$dex").strings"
            strings "$dex" > "$strings_file"
            if ! grep -Eiq '0VGt|0VTU|05Pc|ProfileSidebarContainerAssem|SidebarContainerAssem|ISideBarRootAbility|FX2' "$strings_file"; then
              continue
            fi

            dump="/tmp/dumps/$(basename "$dex").txt"
            timeout 120s "$DEXDUMP" -d "$dex" > "$dump" 2>&1 || true
            test -s "$dump" || continue

            echo "=== DEX $(basename "$dex") ===" >> targeted-ui-evidence.txt
            grep -Ein -B 120 -A 9000 \
              "Class descriptor.*LX/0VGt;|Class descriptor.*LX/0VTU;|Class descriptor.*LX/05Pc;|Class descriptor.*ProfileSidebarContainerAssem;|Class descriptor.*SidebarContainerAssem;|Class descriptor.*ISideBarRootAbility;" \
              "$dump" | head -n 300000 >> targeted-ui-evidence.txt || true
            echo "=== MARKERS $(basename "$dex") ===" >> targeted-ui-evidence.txt
            grep -Ein -B 140 -A 900 'LX/0VGt;|LX/0VTU;|LX/05Pc;|ProfileSidebarContainerAssem|SidebarContainerAssem|ISideBarRootAbility|->FX2\(Z\)|setTranslationX|translationX' \
              "$dump" | head -n 220000 >> targeted-ui-evidence.txt || true
          done

      - name: Upload targeted evidence
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-46.7.3-targeted-ui
          path: targeted-ui-evidence.txt
          if-no-files-found: error
          retention-days: 1
