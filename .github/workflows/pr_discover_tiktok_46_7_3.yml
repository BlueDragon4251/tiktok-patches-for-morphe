name: TikTok fingerprint discovery matrix
on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
concurrency:
  group: tiktok-discovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  discovery:
    uses: ./.github/workflows/tiktok_fixture_matrix.yml
    with:
      kind: discovery
    secrets: inherit
