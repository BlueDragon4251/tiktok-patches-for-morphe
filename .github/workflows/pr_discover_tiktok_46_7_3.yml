name: TikTok 46.7.3 fingerprint discovery

on:
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Download exact TikTok 46.7.3 APK
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="b9e96e64e94ac0f9ea229dd0ba743f1930121a8b6941cf9fd87191604da0129e"
          curl -fL --retry 4 --retry-delay 3 \
            -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36' \
            'https://d.apkpure.net/b/APK/com.zhiliaoapp.musically?version=latest' \
            -o tiktok-46.7.3.apk
          ACTUAL="$(sha256sum tiktok-46.7.3.apk | awk '{print $1}')"
          echo "SHA-256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Dump final migration targets
        shell: bash
        run: |
          set -euo pipefail
          ANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer 2>/dev/null | sort | tail -n 1)"
          test -x "$ANALYZER"
          : > final-evidence.txt
          for cls in \
            X.17qC \
            X.09Y7 \
            kotlin.jvm.internal.AFwS155S0000000_28_I1 \
            com.ss.android.ugc.aweme.comment.keyboard.keyboardv2.refactor.ExposedEmojiPanelTrigger \
            com.ss.android.ugc.aweme.comment.experiment.PersonalizedEmojiExperiment \
            com.ss.android.ugc.aweme.internalshare.impl.feedquickshare.QuickShareButtonTrigger \
            com.ss.android.ugc.aweme.feed.assem.quickcomment.VideoQuickCommentTrigger; do
            echo "=== $cls ===" >> final-evidence.txt
            timeout 55s "$ANALYZER" dex code --class "$cls" tiktok-46.7.3.apk >> final-evidence.txt 2>&1 || true
          done

      - name: Upload discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-46.7.3-fingerprint-discovery
          path: final-evidence.txt
          if-no-files-found: error
          retention-days: 1
