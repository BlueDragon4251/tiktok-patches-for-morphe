name: TikTok 46.7.3 fingerprint discovery

on:
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Download exact TikTok 46.7.3 APK
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="b9e96e64e94ac0f9ea229dd0ba743f1930121a8b6941cf9fd87191604da0129e"
          curl -fL --retry 4 --retry-delay 3 \
            -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36' \
            'https://d.apkpure.net/b/APK/com.zhiliaoapp.musically?version=latest' \
            -o tiktok-46.7.3.apk
          ACTUAL="$(sha256sum tiktok-46.7.3.apk | awk '{print $1}')"
          echo "SHA-256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Dexdump migration anchors
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/dex /tmp/dumps && mkdir -p /tmp/dex /tmp/dumps
          unzip -q -j tiktok-46.7.3.apk 'classes*.dex' -d /tmp/dex
          DEXDUMP="$(find "$ANDROID_HOME/build-tools" -type f -name dexdump 2>/dev/null | sort -V | tail -n 1)"
          test -x "$DEXDUMP"
          REGEX='first_feed_duration|Feed0VVManager|full_feed_commit_process_data|fetchFeeds|tryUseCache|resetClearMode|DOWNLOAD_200_VIDEOS|popCaptcha|captcha|long.?press|quick.?share|quick.?comment|emoji|reaction|MultiCommentTranslation|TranslationTask|onComplete|offline.?mode'
          : > dex-context.txt
          : > raw-evidence.txt
          for dex in /tmp/dex/*.dex; do
            if strings "$dex" | grep -Eiq "$REGEX"; then
              echo "=== $(basename "$dex") ===" >> raw-evidence.txt
              strings "$dex" | grep -Ei "$REGEX|LX/0BIZ;|LX/0BJV;|LX/0itW;|LX/0MPw;|ARunnableS0S0303000_29|FeedApi|ClearModePanelComponent|SecApiImpl|RiskControlService|LiveHostUser" | sort -u | head -n 2500 >> raw-evidence.txt || true
              out="/tmp/dumps/$(basename "$dex").txt"
              timeout 80s "$DEXDUMP" -d "$dex" > "$out" 2>&1 || true
              if test -s "$out"; then
                echo "=== $(basename "$dex") CONTEXT ===" >> dex-context.txt
                grep -Ein -B 90 -A 55 "$REGEX" "$out" | head -n 14000 >> dex-context.txt || true
              fi
            fi
          done

      - name: Upload discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-46.7.3-fingerprint-discovery
          path: |
            dex-context.txt
            raw-evidence.txt
          if-no-files-found: error
          retention-days: 1
