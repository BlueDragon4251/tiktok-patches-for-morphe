name: TikTok 46.7.3 fingerprint discovery

on:
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download exact TikTok 46.7.3 APK
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="b9e96e64e94ac0f9ea229dd0ba743f1930121a8b6941cf9fd87191604da0129e"
          curl -fL --retry 4 --retry-delay 3 \
            -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36' \
            'https://d.apkpure.net/b/APK/com.zhiliaoapp.musically?version=latest' \
            -o tiktok-46.7.3.apk
          ACTUAL="$(sha256sum tiktok-46.7.3.apk | awk '{print $1}')"
          echo "SHA-256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          rm -rf /tmp/dex /tmp/dumps
          mkdir -p /tmp/dex /tmp/dumps
          unzip -q -j tiktok-46.7.3.apk 'classes*.dex' -d /tmp/dex

      - name: Locate and dump remaining anchors
        shell: bash
        run: |
          set -euo pipefail
          DEXDUMP="$(find "$ANDROID_HOME/build-tools" -type f -name dexdump 2>/dev/null | sort -V | tail -n 1)"
          test -x "$DEXDUMP"
          : > remaining-evidence.txt

          REGEX='onSingleTapConfirmed, currentMode=|onSingleTapConfirmed, multiIntercept:|TakoAssem|feed/assem/tikbot|RiskControlService|BdTuringCallback|DOWNLOAD_200_VIDEOS|OfflineModeSheetPageAssem|OfflineModeListVM'

          for dex in /tmp/dex/*.dex; do
            if strings "$dex" | grep -Eiq "$REGEX"; then
              echo "=== MATCHING DEX $(basename "$dex") ===" >> remaining-evidence.txt
              strings "$dex" | grep -Ei "$REGEX|PersonalizedEmojiExperiment|ExposedEmojiPanelTrigger|im_long_press_share_button_to_quick_share" \
                | sort -u | head -n 1000 >> remaining-evidence.txt || true
              dump="/tmp/dumps/$(basename "$dex").txt"
              timeout 100s "$DEXDUMP" -d "$dex" > "$dump" 2>&1 || true
              if test -s "$dump"; then
                echo "=== CONTEXT $(basename "$dex") ===" >> remaining-evidence.txt
                grep -Ein -B 130 -A 100 "$REGEX" "$dump" | head -n 30000 >> remaining-evidence.txt || true
              fi
            fi
          done

      - name: Upload discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-46.7.3-fingerprint-discovery
          path: remaining-evidence.txt
          if-no-files-found: error
          retention-days: 1
