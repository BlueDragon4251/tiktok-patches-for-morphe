name: TikTok 46.7.3 fingerprint discovery

on:
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Download exact TikTok 46.7.3 APK
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="b9e96e64e94ac0f9ea229dd0ba743f1930121a8b6941cf9fd87191604da0129e"
          curl -fL --retry 4 --retry-delay 3 \
            -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36' \
            'https://d.apkpure.net/b/APK/com.zhiliaoapp.musically?version=latest' \
            -o tiktok-46.7.3.apk
          ACTUAL="$(sha256sum tiktok-46.7.3.apk | awk '{print $1}')"
          echo "SHA-256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Find 46.7.3 string xrefs
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet 'androguard>=4.1,<5'
          cat > /tmp/discover.py <<'PY'
          import re
          from androguard.misc import AnalyzeAPK

          needles = re.compile(
              r'first_feed_duration|Feed0VVManager|full_feed_commit_process_data|fetchFeeds|tryUseCache|'
              r'resetClearMode|clear.?mode|DOWNLOAD_200_VIDEOS|offline.{0,30}(video|mode)|'
              r'popCaptcha|captcha|long.?press.{0,40}(share|quick)|quick.{0,40}(share|comment|emoji|reaction)|'
              r'comment.{0,40}(emoji|reaction)|MultiCommentTranslation|TranslationTask|onComplete',
              re.I,
          )
          a, ds, dx = AnalyzeAPK('tiktok-46.7.3.apk')
          rows = []
          seen = set()
          for sa in dx.get_strings():
              try:
                  value = sa.get_value()
              except Exception:
                  continue
              if not value or not needles.search(value):
                  continue
              try:
                  xrefs = list(sa.get_xref_from())
              except Exception:
                  xrefs = []
              for x in xrefs:
                  try:
                      m = x[-1]
                      if hasattr(m, 'get_method'):
                          m = m.get_method()
                      sig = (m.get_class_name(), m.get_name(), m.get_descriptor())
                  except Exception:
                      continue
                  key = (value, sig)
                  if key in seen:
                      continue
                  seen.add(key)
                  rows.append((value, sig, m))

          for value, sig, _ in sorted(rows, key=lambda r: (r[1][0], r[1][1], r[0])):
              print(f'STRING {value!r}')
              print(f'METHOD {sig[0]}->{sig[1]}{sig[2]}')

          print('\n=== DISASSEMBLY ===')
          done = set()
          for value, sig, m in rows:
              if sig in done:
                  continue
              done.add(sig)
              print(f'\n--- {sig[0]}->{sig[1]}{sig[2]} via {value!r} ---')
              try:
                  code = m.get_code()
                  if code is None:
                      continue
                  for i, ins in enumerate(code.get_bc().get_instructions()):
                      if i >= 300:
                          print('...truncated...')
                          break
                      print(f'{i:04d}: {ins.get_name()} {ins.get_output()}')
              except Exception as e:
                  print(f'<error {e}>')
          PY
          timeout 14m python3 /tmp/discover.py > discovery.txt 2>&1 || true

      - name: Raw feature strings
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/dex && mkdir -p /tmp/dex
          unzip -q -j tiktok-46.7.3.apk 'classes*.dex' -d /tmp/dex
          find /tmp/dex -type f -name '*.dex' -print0 | xargs -0 strings 2>/dev/null \
            | grep -Ei 'LX/0BIZ;|LX/0BJV;|LX/0itW;|LX/0MPw;|ARunnableS0S0303000_29|FeedApi|Feed0VVManager|first_feed_duration|full_feed_commit_process_data|fetchFeeds|tryUseCache|resetClearMode|DOWNLOAD_200_VIDEOS|popCaptcha|captcha|long.?press|quick.?share|quick.?comment|emoji|reaction|MultiCommentTranslation|TranslationTask' \
            | sort -u | head -n 6000 > raw-evidence.txt || true

      - name: Upload discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-46.7.3-fingerprint-discovery
          path: |
            discovery.txt
            raw-evidence.txt
          if-no-files-found: error
          retention-days: 1
