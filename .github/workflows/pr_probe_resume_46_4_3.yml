name: Probe TikTok 46.4.3 resume hooks

on:
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install analyzer
        run: python -m pip install --disable-pip-version-check androguard==4.1.3 loguru
      - name: Probe resume gate on exact TikTok 46.4.3 APK
        shell: bash
        env:
          LOGURU_LEVEL: ERROR
        run: |
          python - <<'PY'
          import hashlib, html, urllib.request, sys
          from html.parser import HTMLParser
          from loguru import logger
          logger.remove(); logger.add(sys.stderr, level='ERROR')
          from androguard.core.apk import APK
          from androguard.core.dex import DEX

          PAGE = 'https://www.mediafire.com/file/sd2x6vnmv1ocnv7/com.zhiliaoapp.musically_46.4.3-2024604030_minAPI23(arm64-v8a,armeabi-v7a)(nodpi)_apkmirror.com.apk/file'
          EXPECTED = '79062fb88d2eef8d6e11bbf766b4b40ee08d89cdc594ff26b549ccce7b50c4b2'
          UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'

          class Parser(HTMLParser):
              def __init__(self): super().__init__(); self.url = None
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag == 'a' and a.get('id') == 'downloadButton': self.url = a.get('href')

          req = urllib.request.Request(PAGE, headers={'User-Agent': UA})
          with urllib.request.urlopen(req, timeout=60) as r:
              page = r.read().decode('utf-8', errors='replace')
          p = Parser(); p.feed(page)
          if not p.url: raise RuntimeError('MediaFire direct URL not found')
          digest = hashlib.sha256()
          req = urllib.request.Request(html.unescape(p.url), headers={'User-Agent': UA})
          with urllib.request.urlopen(req, timeout=180) as r, open('tiktok.apk', 'wb') as out:
              while True:
                  b = r.read(1024 * 1024)
                  if not b: break
                  out.write(b); digest.update(b)
          if digest.hexdigest() != EXPECTED: raise RuntimeError('APK SHA mismatch')

          apk = APK('tiktok.apk')
          candidates = []
          PLAYER = 'Lcom/ss/android/ugc/aweme/player/sdk/api/PlayerController;->'

          for di, data in enumerate(apk.get_all_dex(), 1):
              dex = DEX(data)
              for cls in dex.get_classes():
                  for m in cls.get_methods():
                      if not m.get_code(): continue
                      insns = list(m.get_instructions())
                      player_float_calls = []
                      for i, ins in enumerate(insns):
                          text = ins.get_output().replace(' ', '')
                          if PLAYER in text and '(F)V' in text:
                              player_float_calls.append(i)
                      if len(player_float_calls) >= 2:
                          candidates.append((len(player_float_calls), di, cls.get_name(), m, insns, player_float_calls))

          candidates.sort(key=lambda x: (-x[0], x[1], x[2]))
          print(f'RESUME_PLAYER_FLOAT_CANDIDATE_COUNT={len(candidates)}')
          for count, di, cls_name, m, insns, call_indices in candidates[:30]:
              descriptor = m.get_descriptor().replace(' ', '')
              print(f'\n===== RESUME_PLAYER_CANDIDATE dex={di} class={cls_name} method={m.get_name()}{descriptor} calls={count} indices={call_indices} =====')
              for i, ins in enumerate(insns):
                  text = ins.get_output()
                  if (len(insns) <= 180 or ins.get_name().startswith(('invoke','iget','sget','iput','sput','return','if-','const')) or 'PlayerController;' in text):
                      print(f'{i:04d}: {ins.get_name():28s} {text}')

          print('\n===== ZERO-ARG OBJECT LAMBDAS WITH PLAYER FLOAT CALLS =====')
          shown = 0
          for di, data in enumerate(apk.get_all_dex(), 1):
              dex = DEX(data)
              for cls in dex.get_classes():
                  for m in cls.get_methods():
                      if m.get_name() != 'invoke' or m.get_descriptor().replace(' ', '') != '()Ljava/lang/Object;' or not m.get_code(): continue
                      insns = list(m.get_instructions())
                      matches = [i for i, ins in enumerate(insns) if PLAYER in ins.get_output().replace(' ', '') and '(F)V' in ins.get_output().replace(' ', '')]
                      if not matches: continue
                      print(f'\nONE_CALL_LAMBDA dex={di} class={cls.get_name()} calls={len(matches)} indices={matches}')
                      for i, ins in enumerate(insns):
                          if len(insns) <= 120 or ins.get_name().startswith(('invoke','iget','sget','return','if-')):
                              print(f'{i:04d}: {ins.get_name():28s} {ins.get_output()}')
                      shown += 1
                      if shown >= 40: raise SystemExit(0)
          PY
