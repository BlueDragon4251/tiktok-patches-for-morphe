name: Probe TikTok 46.4.3 resume hooks

on:
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install analyzer
        run: python -m pip install --disable-pip-version-check androguard==4.1.3 loguru
      - name: Probe resume gate and state on exact TikTok 46.4.3 APK
        shell: bash
        env:
          LOGURU_LEVEL: ERROR
        run: |
          python - <<'PY'
          import hashlib, html, re, urllib.request, sys
          from html.parser import HTMLParser
          from loguru import logger
          logger.remove(); logger.add(sys.stderr, level='ERROR')
          from androguard.core.apk import APK
          from androguard.core.dex import DEX

          PAGE = 'https://www.mediafire.com/file/sd2x6vnmv1ocnv7/com.zhiliaoapp.musically_46.4.3-2024604030_minAPI23(arm64-v8a,armeabi-v7a)(nodpi)_apkmirror.com.apk/file'
          EXPECTED = '79062fb88d2eef8d6e11bbf766b4b40ee08d89cdc594ff26b549ccce7b50c4b2'
          UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          STATE = 'LX/0M75;'
          ITEM = 'LX/0M55;'
          CONFIG = 'Lcom/ss/android/ugc/aweme/feed/experiment/FeedPlayProgressContinueConfig;'

          class Parser(HTMLParser):
              def __init__(self): super().__init__(); self.url = None
              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  if tag == 'a' and values.get('id') == 'downloadButton': self.url = values.get('href')

          request = urllib.request.Request(PAGE, headers={'User-Agent': UA})
          with urllib.request.urlopen(request, timeout=60) as response:
              page = response.read().decode('utf-8', errors='replace')
          parser = Parser(); parser.feed(page)
          if not parser.url: raise RuntimeError('MediaFire direct URL not found')

          digest = hashlib.sha256()
          request = urllib.request.Request(html.unescape(parser.url), headers={'User-Agent': UA})
          with urllib.request.urlopen(request, timeout=180) as response, open('tiktok.apk', 'wb') as output:
              while True:
                  chunk = response.read(1024 * 1024)
                  if not chunk: break
                  output.write(chunk); digest.update(chunk)
          actual = digest.hexdigest()
          print('APK_SHA256=', actual)
          if actual != EXPECTED: raise RuntimeError('APK SHA mismatch')

          apk = APK('tiktok.apk')
          class_map = {}
          dex_no = {}
          for di, data in enumerate(apk.get_all_dex(), 1):
              dex = DEX(data)
              for cls in dex.get_classes():
                  class_map[cls.get_name()] = cls
                  dex_no[cls.get_name()] = di

          def desc(method): return method.get_descriptor().replace(' ', '')
          def print_method(owner, method, limit=160):
              print(f'METHOD {owner}->{method.get_name()}{desc(method)} flags={method.get_access_flags_string()}')
              if not method.get_code(): return
              instructions = list(method.get_instructions())
              for i, ins in enumerate(instructions[:limit]):
                  print(f'  {i:04d}: {ins.get_name():28s} {ins.get_output()}')
              if len(instructions) > limit:
                  print(f'  ... {len(instructions)-limit} more ...')

          def dump_class(name):
              cls = class_map.get(name)
              print(f'\n===== CLASS {name} dex={dex_no.get(name)} exists={cls is not None} =====')
              if cls is None: return set()
              print('FIELDS:')
              for field in cls.get_fields():
                  try:
                      print(f'  {field.get_name()} {field.get_descriptor()} flags={field.get_access_flags_string()}')
                  except Exception:
                      print(' ', field)
              refs = set()
              for method in cls.get_methods():
                  if method.get_name() == '<clinit>' or name == ITEM:
                      print_method(name, method)
                      if method.get_code():
                          for ins in method.get_instructions():
                              refs.update(re.findall(r'L[^; ]+;', ins.get_output()))
              return refs

          clinit_refs = dump_class(STATE)
          dump_class(ITEM)

          print('\n===== STATE INITIALIZER CLASSES =====')
          for name in sorted(clinit_refs):
              cls = class_map.get(name)
              if cls is None or name in {STATE, ITEM}:
                  continue
              matches = [m for m in cls.get_methods() if m.get_name() == 'invoke' and desc(m) == '()Ljava/lang/Object;']
              if not matches:
                  continue
              print(f'CLASS {name} dex={dex_no.get(name)}')
              for method in matches:
                  print_method(name, method, 120)

          print('\n===== RESUME GATE CANDIDATES =====')
          candidates = []
          for name, cls in class_map.items():
              for method in cls.get_methods():
                  if method.get_name() != 'invoke' or desc(method) != '()Ljava/lang/Object;' or not method.get_code():
                      continue
                  instructions = list(method.get_instructions())
                  outputs = [ins.get_output() for ins in instructions]
                  score = 0
                  if any(CONFIG in out for out in outputs): score += 5
                  if any(STATE in out for out in outputs): score += 4
                  if any(ITEM in out for out in outputs): score += 2
                  if any('Ljava/lang/Boolean;->valueOf(Z)Ljava/lang/Boolean;' in out.replace(' ', '') for out in outputs): score += 1
                  if score:
                      candidates.append((score, name, method))
          candidates.sort(key=lambda row: (-row[0], row[1]))
          print('CANDIDATE_COUNT=', len(candidates))
          for score, name, method in candidates[:40]:
              print(f'\nCANDIDATE score={score} class={name} dex={dex_no.get(name)}')
              print_method(name, method, 120)
          PY
