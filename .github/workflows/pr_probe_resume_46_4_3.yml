name: Probe TikTok 46.4.3 resume hooks

on:
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install analyzer
        run: python -m pip install --disable-pip-version-check androguard==4.1.3 loguru
      - name: Probe resume state on exact TikTok 46.4.3 APK
        shell: bash
        env:
          LOGURU_LEVEL: ERROR
        run: |
          python - <<'PY'
          import hashlib, html, re, urllib.request, sys
          from html.parser import HTMLParser
          from loguru import logger
          logger.remove(); logger.add(sys.stderr, level='ERROR')
          from androguard.core.apk import APK
          from androguard.core.dex import DEX

          PAGE = 'https://www.mediafire.com/file/sd2x6vnmv1ocnv7/com.zhiliaoapp.musically_46.4.3-2024604030_minAPI23(arm64-v8a,armeabi-v7a)(nodpi)_apkmirror.com.apk/file'
          EXPECTED = '79062fb88d2eef8d6e11bbf766b4b40ee08d89cdc594ff26b549ccce7b50c4b2'
          UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          PLAYER = 'Lcom/ss/android/ugc/aweme/feed/controller/PlayerController;'

          class Parser(HTMLParser):
              def __init__(self): super().__init__(); self.url = None
              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  if tag == 'a' and values.get('id') == 'downloadButton': self.url = values.get('href')

          request = urllib.request.Request(PAGE, headers={'User-Agent': UA})
          with urllib.request.urlopen(request, timeout=60) as response:
              page = response.read().decode('utf-8', errors='replace')
          parser = Parser(); parser.feed(page)
          if not parser.url: raise RuntimeError('MediaFire direct URL not found')

          digest = hashlib.sha256()
          request = urllib.request.Request(html.unescape(parser.url), headers={'User-Agent': UA})
          with urllib.request.urlopen(request, timeout=180) as response, open('tiktok.apk', 'wb') as output:
              while True:
                  chunk = response.read(1024 * 1024)
                  if not chunk: break
                  output.write(chunk); digest.update(chunk)
          actual = digest.hexdigest()
          print('APK_SHA256=', actual)
          if actual != EXPECTED: raise RuntimeError('APK SHA mismatch')

          apk = APK('tiktok.apk')
          class_map = {}
          dex_no = {}
          for di, data in enumerate(apk.get_all_dex(), 1):
              dex = DEX(data)
              for cls in dex.get_classes():
                  class_map[cls.get_name()] = cls
                  dex_no[cls.get_name()] = di

          player = class_map.get(PLAYER)
          if player is None:
              raise RuntimeError('PlayerController class not found')
          print('PLAYER_DEX=', dex_no[PLAYER])

          referenced_classes = set()
          def dump_method(method):
              descriptor = method.get_descriptor().replace(' ', '')
              print(f'\nMETHOD {PLAYER}->{method.get_name()}{descriptor}')
              if not method.get_code(): return
              for index, instruction in enumerate(method.get_instructions()):
                  text = instruction.get_output()
                  print(f'{index:04d}: {instruction.get_name():28s} {text}')
                  for match in re.findall(r'L(?:X|com|android|java|kotlin)/[^;]+;', text):
                      if match != PLAYER:
                          referenced_classes.add(match)

          targets = {'onPlayCompleted', 'onPlayProgressChange'}
          found = 0
          for method in player.get_methods():
              if method.get_name() in targets:
                  found += 1
                  dump_method(method)
          print('PLAYER_TARGET_METHODS=', found)
          if found != 2:
              raise RuntimeError(f'Expected 2 PlayerController target methods, found {found}')

          print('\n===== REFERENCED STATE/LAMBDA CLASSES =====')
          for name in sorted(referenced_classes):
              cls = class_map.get(name)
              if cls is None:
                  continue
              methods = list(cls.get_methods())
              interesting = []
              for method in methods:
                  descriptor = method.get_descriptor().replace(' ', '')
                  if (method.get_name() == 'invoke' and descriptor == '()Ljava/lang/Object;') or \
                     'Landroid/util/LruCache;' in descriptor or method.get_name() == '<clinit>':
                      interesting.append(method)
              if not interesting:
                  # Also keep small obfuscated utility/state classes referenced by the two callbacks.
                  if not name.startswith('LX/') or len(methods) > 20:
                      continue
                  interesting = methods
              print(f'\nCLASS {name} dex={dex_no.get(name)} methods={len(methods)}')
              for method in interesting:
                  descriptor = method.get_descriptor().replace(' ', '')
                  print(f'  METHOD {method.get_name()}{descriptor} flags={method.get_access_flags_string()}')
                  if not method.get_code(): continue
                  instructions = list(method.get_instructions())
                  if len(instructions) > 120 and method.get_name() not in {'invoke', '<clinit>'}:
                      continue
                  for index, instruction in enumerate(instructions):
                      text = instruction.get_output()
                      if len(instructions) <= 120 or instruction.get_name().startswith(('invoke','iget','sget','iput','sput','return','if-')):
                          print(f'    {index:04d}: {instruction.get_name():26s} {text}')
          PY
