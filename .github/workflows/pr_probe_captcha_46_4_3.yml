name: Probe TikTok 46.4.3 CAPTCHA hooks

on:
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install analyzer
        run: python -m pip install --disable-pip-version-check androguard==4.1.3 loguru
      - name: Probe CAPTCHA hooks on exact TikTok 46.4.3 APK
        shell: bash
        env:
          LOGURU_LEVEL: ERROR
        run: |
          python - <<'PY'
          import hashlib, html, re, sys, urllib.request
          from html.parser import HTMLParser
          from loguru import logger
          logger.remove(); logger.add(sys.stderr, level='ERROR')
          from androguard.core.apk import APK
          from androguard.core.dex import DEX

          PAGE = 'https://www.mediafire.com/file/sd2x6vnmv1ocnv7/com.zhiliaoapp.musically_46.4.3-2024604030_minAPI23(arm64-v8a,armeabi-v7a)(nodpi)_apkmirror.com.apk/file'
          EXPECTED = '79062fb88d2eef8d6e11bbf766b4b40ee08d89cdc594ff26b549ccce7b50c4b2'
          UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'

          class Parser(HTMLParser):
              def __init__(self): super().__init__(); self.url = None
              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  if tag == 'a' and values.get('id') == 'downloadButton': self.url = values.get('href')

          request = urllib.request.Request(PAGE, headers={'User-Agent': UA})
          with urllib.request.urlopen(request, timeout=60) as response:
              page = response.read().decode('utf-8', errors='replace')
          parser = Parser(); parser.feed(page)
          if not parser.url: raise RuntimeError('MediaFire direct URL not found')

          digest = hashlib.sha256()
          request = urllib.request.Request(html.unescape(parser.url), headers={'User-Agent': UA})
          with urllib.request.urlopen(request, timeout=180) as response, open('tiktok.apk', 'wb') as output:
              while True:
                  chunk = response.read(1024 * 1024)
                  if not chunk: break
                  output.write(chunk); digest.update(chunk)
          actual = digest.hexdigest()
          print('APK_SHA256=', actual)
          if actual != EXPECTED: raise RuntimeError('APK SHA mismatch')

          apk = APK('tiktok.apk')
          classes = []
          class_map = {}
          dex_no = {}
          for di, data in enumerate(apk.get_all_dex(), 1):
              dex = DEX(data)
              for cls in dex.get_classes():
                  classes.append(cls)
                  class_map[cls.get_name()] = cls
                  dex_no[cls.get_name()] = di

          def desc(method):
              try: return method.get_descriptor().replace(' ', '')
              except Exception: return str(method.get_descriptor())

          def dump_method(owner, method, limit=220):
              print(f'\nMETHOD dex={dex_no.get(owner)} {owner}->{method.get_name()}{desc(method)} flags={method.get_access_flags_string()}')
              if not method.get_code(): return
              for i, ins in enumerate(method.get_instructions()):
                  if i >= limit:
                      print('  ... truncated ...'); break
                  print(f'  {i:04d}: {ins.get_name():28s} {ins.get_output()}')

          print('\n===== NAMED CAPTCHA CLASSES =====')
          target_classes = []
          for cls in classes:
              name = cls.get_name()
              low = name.lower()
              if any(token in low for token in ('secapiimpl', 'riskcontrolservice', 'livehostuser', 'captcha')):
                  target_classes.append(cls)
                  print(f'CLASS dex={dex_no.get(name)} {name}')
                  for method in cls.get_methods():
                      print(f'  {method.get_name()}{desc(method)} flags={method.get_access_flags_string()}')

          print('\n===== METHODS WITH CAPTCHA/RISK STRINGS OR NAMES =====')
          matched = []
          needles = ('captcha', 'riskinfo', 'errorcode')
          for cls in classes:
              owner = cls.get_name()
              for method in cls.get_methods():
                  hit = 'captcha' in method.get_name().lower()
                  if method.get_code():
                      for ins in method.get_instructions():
                          out = ins.get_output().lower()
                          if any(n in out for n in needles):
                              hit = True
                              break
                  if hit:
                      matched.append((owner, method))
          print('MATCHED_METHOD_COUNT=', len(matched))
          for owner, method in matched[:120]:
              dump_method(owner, method)

          print('\n===== CALLBACK-LIKE PARAMETER CLASSES =====')
          refs = set()
          for owner, method in matched:
              descriptor = desc(method)
              for ref in re.findall(r'L[^;]+;', descriptor):
                  if ref.startswith('LX/'):
                      refs.add(ref)
          for ref in sorted(refs):
              cls = class_map.get(ref)
              if cls is None: continue
              print(f'CLASS dex={dex_no.get(ref)} {ref}')
              for method in cls.get_methods():
                  print(f'  {method.get_name()}{desc(method)} flags={method.get_access_flags_string()}')
          PY
